<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>下厨房食材热门度</title>
    <style>
      body {
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 12px;
        width: 320px;
        color: #222;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      .row {
        margin: 6px 0;
      }
      .muted {
        color: #666;
        font-size: 12px;
      }
      .err {
        color: #b00020;
        font-size: 12px;
        white-space: pre-wrap;
      }
      button {
        margin: 4px 4px 0 0;
        padding: 6px 10px;
        cursor: pointer;
      }
      #importFile {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>下厨房食材热门度</h1>
    <div class="row muted">请先打开 mbdbj.xiachufang.com 首页</div>
    <div class="row muted">保存：<span id="saveServer">—</span></div>
    <div class="row">状态：<strong id="status">—</strong></div>
    <div class="row">进度：<span id="progress">—</span></div>
    <div class="row">当前：<span id="current">—</span></div>
    <div class="row err" id="reason"></div>
    <div class="row">
      <button id="btnStart">开始</button>
      <button id="btnPause">暂停</button>
      <button id="btnResume">继续</button>
    </div>
    <div class="row">
      <input
        id="refetchName"
        type="text"
        placeholder="食材名，如 番茄"
        style="width: 140px; padding: 5px 8px"
      />
      <button id="btnRefetch">重抓此食材</button>
    </div>
    <div class="row muted">重抓只跑这一条，完成后自动导出并暂停</div>
    <div class="row">
      <button id="btnExport">再导出结果</button>
      <button id="btnImport">导入进度 JSON</button>
      <input id="importFile" type="file" accept="application/json,.json" />
    </div>
    <script src="popup.js"></script>
  </body>
</html>
